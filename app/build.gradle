dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.firebase.crashlytics
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.viewpager2

    // Lifecycle / ViewModel / StateFlow
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.process

    // Coroutines
    implementation libs.kotlinx.coroutines.android

    // DataStore Preferences
    implementation libs.androidx.datastore.preferences

    // Biometric
    implementation libs.androidx.biometric

    // Hilt
    implementation libs.hilt.android
    implementation libs.firebase.analytics
    implementation libs.firebase.config
    ksp libs.hilt.compiler

    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // RecyclerView + image loading + media playback
    implementation libs.androidx.recyclerview
    implementation libs.glide
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui

    // CameraX (Private Camera)
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.androidx.camera.video

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // Firebase Remote Config
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.config.ktx

    // Firebase Cloud Messaging (push notifications; version comes from the BoM)
    implementation libs.firebase.messaging

    // Scalable dp/sp used by the ported onboarding/language layouts
    implementation libs.intuit.sdp
    implementation libs.intuit.ssp
    implementation libs.shimmer
    implementation(project(":adssdk"))
    implementation("com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.2.1")
    implementation("com.google.android.ump:user-messaging-platform:4.0.0")
    implementation('com.google.ads.mediation:facebook:6.21.0.4') {
